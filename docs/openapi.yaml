openapi: 3.0.3
info:
  title: Book Reading Backend API
  description: REST API for the Book Reading application - novel scraping, translation, and reading management
  version: 1.0.0
  contact:
    name: API Support
    email: support@bookreading.app

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.bookreading.app
    description: Production server

paths:
  /api/health:
    get:
      summary: Health check
      description: Check if the service is healthy
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

  /api/auth/register:
    post:
      summary: Register new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid request

  /api/auth/login:
    post:
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          headers:
            Authorization:
              schema:
                type: string
              description: Bearer token
        '401':
          description: Invalid credentials

  /api/novels:
    get:
      summary: List all novels
      operationId: listNovels
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of novels
    post:
      summary: Scrape a novel from URL
      operationId: scrapeNovel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                source_lang:
                  type: string
                  default: zh
      responses:
        '200':
          description: Novel scraped successfully

  /api/chapters/translate:
    post:
      summary: Translate a chapter
      operationId: translateChapter
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - novel_id
                - chapter_number
              properties:
                novel_id:
                  type: string
                chapter_number:
                  type: integer
                translator_type:
                  type: string
                  enum: [google, agentic, pipeline]
                  default: google
      responses:
        '200':
          description: Chapter translated successfully
        '401':
          description: Unauthorized

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
