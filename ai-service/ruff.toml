# Explicit rule set so CI does not change when ruff's defaults change.
# Start with correctness rules (pyflakes + syntax/runtime pycodestyle);
# widen gradually (see docs/UPGRADE-PLAN.md).
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Imports intentionally follow optional-dependency probing / app setup.
"main.py" = ["E402"]
"manga_translator.py" = ["E402"]
