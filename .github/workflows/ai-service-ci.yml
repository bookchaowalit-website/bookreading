name: AI Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ai-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'ai-service/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install ruff
        run: pip install "ruff==0.16.9"

      # Rules are pinned in ai-service/ruff.toml. `ruff format --check` is not
      # enforced yet: the code base predates the formatter (see UPGRADE-PLAN).
      - name: Run ruff linter
        run: ruff check .
        working-directory: ai-service

  test:
    name: Test
    runs-on: ubuntu-latest
    # Unit tests need no database or network; integration tests are
    # deselected by pytest.ini (`-m "not integration"`).
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-cov
          pip install -r requirements.txt
        working-directory: ai-service

      - name: Run tests
        run: pytest -v --cov=. --cov-report=xml
        working-directory: ai-service

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ai-service/coverage.xml
          flags: ai-service
          fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./ai-service
          push: false
          tags: bookreading-ai:ci-build
          cache-from: type=gha
          cache-to: type=gha,mode=max
