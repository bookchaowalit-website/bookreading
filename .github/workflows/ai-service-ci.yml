name: AI Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ai-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'ai-service/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r ai-service/requirements.txt

      - name: Run ruff linter
        run: ruff check ai-service/

      - name: Run ruff formatter check
        run: ruff format --check ai-service/

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bookreading
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: bookreading_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -r ai-service/requirements.txt

      - name: Run tests
        run: pytest ai-service/ -v --cov=. --cov-report=xml
        env:
          DATABASE_URL: postgres://bookreading:testpassword@localhost:5432/bookreading_test?sslmode=disable

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: ai-service
          fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: false
          tags: bookreading-ai:ci-build
          cache-from: type=gha
          cache-to: type=gha,mode=max
