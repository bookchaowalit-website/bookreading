services:
  postgres:
    image: postgres:15-alpine
    container_name: bookreading-db
    environment:
      POSTGRES_USER: bookreading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: bookreading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bookreading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookreading"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookreading-backend
    ports:
      - "9091:9090"
      - "8888:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://bookreading:${POSTGRES_PASSWORD}@postgres:5432/bookreading?sslmode=disable
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      HTTP_PORT: "8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STRIPE_BILLING_PORTAL_RETURN_URL: ${STRIPE_BILLING_PORTAL_RETURN_URL:-http://localhost:3000/app/settings}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookreading-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: bookreading-ai-service
    ports:
      # The browser never calls ai-service: the frontend goes through the
      # backend's /api/ai proxy, which adds AI_SERVICE_TOKEN (shared through
      # env_file). This port is for local debugging only and stays on loopback;
      # set AI_SERVICE_TOKEN in production.
      - "${AI_SERVICE_BIND:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://bookreading:${POSTGRES_PASSWORD}@postgres:5432/bookreading?sslmode=disable
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookreading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8888
    container_name: bookreading-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8888
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - bookreading-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  backup:
    image: postgres:15-alpine
    container_name: bookreading-backup
    profiles: ["backup"]
    command:
      - sh
      - -c
      - |
        mkdir -p /backups && pg_dump -h postgres -U bookreading -d bookreading | gzip > /backups/bookreading_$$(date +%Y%m%d_%H%M%S).sql.gz
    volumes:
      - ./backups:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookreading-network

networks:
  bookreading-network:
    driver: bridge

volumes:
  postgres_data:
